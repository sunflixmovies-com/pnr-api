<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyStore Admin - Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.hide{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf4ff,#f8fafc)}.loginbox{width:min(390px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;box-shadow:0 20px 60px #00000012}.logo{width:48px;height:48px;border-radius:14px;background:#2874f0;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin-bottom:16px}.login h1{font-size:24px;margin:0 0 4px}.muted{color:#6b7280;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:10px 12px;outline:0;background:#fff}.primary{border:0;border-radius:10px;background:#2874f0;color:#fff;padding:11px 16px;font-weight:800}.err{color:#e11d48;font-size:13px;margin:8px 0}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:17px}.badge-logo{width:38px;height:38px;border-radius:11px;background:#2874f0;color:#fff;display:grid;place-items:center;font-weight:900}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #dfe3e8;background:#fff;color:#374151;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800}.btn.blue{background:#2874f0;color:#fff;border-color:#2874f0}.btn.green{background:#0f766e;color:#fff;border-color:#0f766e}.btn.red{background:#e11d48;color:#fff;border-color:#e11d48}.wrap{max-width:1500px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px}.stat small{color:#6b7280;font-weight:700}.stat strong{display:block;font-size:22px;margin-top:4px}.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.filter{border:1px solid #dfe3e8;background:#fff;border-radius:18px;padding:7px 11px;font-size:11px;font-weight:800}.filter.active{background:#2874f0;color:#fff;border-color:#2874f0}.search{margin-left:auto}.search input{width:260px;border:1px solid #dfe3e8;border-radius:20px;padding:8px 12px;outline:0}.orders{columns:2 520px;column-gap:14px}.card{break-inside:avoid;background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.head{display:flex;justify-content:space-between;gap:10px}.oid{font-weight:900;font-size:13px}.uuid{font:10px monospace;color:#9ca3af;word-break:break-all;margin-top:2px}.date{font-size:11px;color:#6b7280;margin-top:3px}.status{padding:5px 9px;border-radius:20px;font-size:10px;font-weight:900;text-transform:uppercase;height:max-content}.placed{background:#e8f7ef;color:#16803a}.processed{background:#eef2ff;color:#4f46e5}.shipped{background:#eaf2ff;color:#2874f0}.out_for_delivery{background:#f6eaff;color:#9333ea}.delivered{background:#e8f8f5;color:#0f766e}.cancel_requested{background:#fff5df;color:#b45309}.cancelled{background:#fdecec;color:#e11d48}.items{display:flex;gap:9px;overflow:auto;padding:10px 0}.item{min-width:60px;text-align:center}.item img{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#f3f4f6}.item span{display:block;font-size:9px;color:#6b7280;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.info{font-size:12px;line-height:1.55;color:#4b5563}.info b{color:#111827}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{background:#f3f4f6;padding:5px 7px;border-radius:7px;font-size:10px;font-weight:700;color:#4b5563}.total{font-weight:900;font-size:16px}.cardactions{border-top:1px solid #f0f1f3;margin-top:11px;padding-top:11px;display:flex;gap:6px;flex-wrap:wrap}.empty{background:#fff;border:1px dashed #d5dbe2;border-radius:14px;padding:55px;text-align:center;color:#6b7280}.modal{position:fixed;inset:0;background:#0007;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;padding:18px}.mh{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:11px;margin-bottom:13px}.close{border:0;border-radius:50%;width:32px;height:32px;background:#f1f3f5;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{background:#f8fafc;padding:10px;border-radius:10px}.detail small{display:block;color:#6b7280;font-size:10px;font-weight:800}.detail b{font-size:13px}.loader{position:fixed;inset:0;background:#fff9;z-index:200;display:none;place-items:center}.loader.show{display:grid}.spinner{width:42px;height:42px;border:4px solid #dbe3ef;border-top-color:#2874f0;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-120px);background:#111827;color:#fff;padding:11px 17px;border-radius:10px;font-size:13px;font-weight:800;z-index:300;transition:.3s}.toast.show{transform:translate(-50%,0)}.toast.err{background:#e11d48}.chatmsgs{height:48vh;overflow:auto;background:#f8fafc;border-radius:11px;padding:10px}.bubble{max-width:78%;padding:9px 12px;border-radius:13px;margin:7px 0;font-size:13px}.bubble.admin{margin-left:auto;background:#2874f0;color:#fff}.bubble.user{background:#fff;border:1px solid #e5e7eb}.row{display:flex;gap:8px;margin-top:9px}.row input{flex:1;border:1px solid #dfe3e8;border-radius:20px;padding:10px 13px}.chatrow{padding:11px;border-bottom:1px solid #eee;cursor:pointer}.chatrow:hover{background:#f8fafc}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{padding:10px 12px}.adminmail{display:none}.wrap{padding:11px}.orders{columns:1}.search{width:100%;margin-left:0}.search input{width:100%}.grid{grid-template-columns:1fr}.box{padding:14px}.top .btn{padding:7px 9px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div><div id="loader" class="loader"><div class="spinner"></div></div>
<section id="login" class="login"><div class="loginbox"><div class="logo">M</div><h1>Admin Login</h1><p class="muted">MyStore Order Management</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div id="loginErr" class="err hide"></div><button id="loginBtn" class="primary" style="width:100%" onclick="login()">Log In</button></div></section>
<section id="app" class="hide"><header class="top"><div class="brand"><div class="badge-logo">M</div><div><b>Orders Admin</b><div id="adminMail" class="muted adminmail"></div></div></div><div class="actions"><button class="btn" onclick="openInbox()">📥 Inbox</button><button class="btn" onclick="openBroadcast()">＋ Notify</button><button class="btn" onclick="loadOrders()">↻ Refresh</button><button class="btn red" onclick="logout()">Logout</button></div></header><main class="wrap"><div class="stats"><div class="stat"><small>Total</small><strong id="a">0</strong></div><div class="stat"><small>Placed</small><strong id="b">0</strong></div><div class="stat"><small>Shipped</small><strong id="c">0</strong></div><div class="stat"><small>Out for Delivery</small><strong id="d">0</strong></div><div class="stat"><small>Delivered</small><strong id="e">0</strong></div></div><div class="toolbar"><button class="filter active" onclick="setFilter('all',this)">All</button><button class="filter" onclick="setFilter('placed',this)">Placed</button><button class="filter" onclick="setFilter('processed',this)">Processed</button><button class="filter" onclick="setFilter('shipped',this)">Shipped</button><button class="filter" onclick="setFilter('out_for_delivery',this)">Out for Delivery</button><button class="filter" onclick="setFilter('delivered',this)">Delivered</button><button class="filter" onclick="setFilter('cancel_requested',this)">Cancel Requests</button><button class="filter" onclick="setFilter('cancelled',this)">Cancelled</button><div class="search"><input id="search" placeholder="Search order / name / email / phone" oninput="render()"></div></div><div id="orders" class="orders"></div></main></section>
<div id="detail" class="modal"><div class="box"><div class="mh"><h3 id="detailTitle" style="margin:0">Order</h3><button class="close" onclick="closeM('detail')">×</button></div><div id="detailBody"></div></div></div>
<div id="action" class="modal"><div class="box" style="max-width:430px"><div class="mh"><h3 id="actionTitle" style="margin:0">Update</h3><button class="close" onclick="closeM('action')">×</button></div><div id="actionBody"></div></div></div>
<div id="chat" class="modal"><div class="box"><div class="mh"><h3 id="chatTitle" style="margin:0">Chat</h3><button class="close" onclick="closeM('chat')">×</button></div><div id="chatMsgs" class="chatmsgs"></div><div class="row"><input id="chatInput" placeholder="Type a reply..." onkeydown="if(event.key==='Enter')sendChat()"><button class="primary" onclick="sendChat()">Send</button></div></div></div>
<div id="inbox" class="modal"><div class="box"><div class="mh"><h3 style="margin:0">Chat Inbox</h3><button class="close" onclick="closeM('inbox')">×</button></div><div id="inboxList"></div></div></div>
<div id="broadcast" class="modal"><div class="box" style="max-width:470px"><div class="mh"><h3 style="margin:0">Send Notification</h3><button class="close" onclick="closeM('broadcast')">×</button></div><div class="field"><label>Title</label><input id="ntitle" value="Order Update"></div><div class="field"><label>Message</label><textarea id="nmsg" rows="4"></textarea></div><div class="field"><label>Image URL (optional)</label><input id="nimg"></div><button class="primary" style="width:100%" onclick="sendNotification()">Send to Customers</button></div></div>
<script>
const SUPABASE_URL='https://bszojvhitsoamhksyjul.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzem9qdmhpdHNvYW1oa3N5anVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1OTY0OTMsImV4cCI6MjEwMjE3MjQ5M30.QW1vat89dYrOYY0U8Bk6BwAcunTIISduPhk7ngz3iBE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let orders=[],filter='all',chatId=null,realtime=null;
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>'₹'+Math.round(Number(x)||0).toLocaleString('en-IN');
function toast(x,err){let t=$('toast');t.textContent=x;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2500)}function busy(x){$('loader').classList.toggle('show',x)}function showM(x){$(x).classList.add('show')}function closeM(x){$(x).classList.remove('show')}function dt(x){return x?new Date(x).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—'}function idof(o){return o.order_number||String(o.id).slice(0,8).toUpperCase()}function addr(o){return o.address&&typeof o.address==='object'?o.address:{}}function its(o){return Array.isArray(o.items)?o.items:(o.items&&Array.isArray(o.items.items)?o.items.items:[])}function iname(x){return x.name||x.title||x.product_name||'Product'}function iimg(x){return x.image||x.product_image||x.main_image||''}function qty(x){return Number(x.qty||x.quantity||1)}function price(x){return Number(x.price||x.sell_price||0)}
async function isAdmin(uid){let r=await sb.from('admin_users').select('is_admin').eq('user_id',uid).maybeSingle();if(r.error)throw r.error;return !!r.data?.is_admin}
async function init(){let r=await sb.auth.getSession();if(r.data.session){try{if(await isAdmin(r.data.session.user.id))openApp(r.data.session.user);else await sb.auth.signOut()}catch(e){console.error(e)}}}
async function login(){let em=$('email').value.trim(),pw=$('password').value,er=$('loginErr');er.classList.add('hide');if(!em||!pw){er.textContent='Email and password are required.';er.classList.remove('hide');return}let b=$('loginBtn');b.disabled=true;b.textContent='Logging in...';try{let r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;if(!await isAdmin(r.data.user.id)){await sb.auth.signOut();throw Error('This account is not authorized as admin.')}openApp(r.data.user)}catch(e){er.textContent=e.message;er.classList.remove('hide')}b.disabled=false;b.textContent='Log In'}
async function logout(){if(realtime)sb.removeChannel(realtime);await sb.auth.signOut();location.reload()}function openApp(u){$('login').classList.add('hide');$('app').classList.remove('hide');$('adminMail').textContent=u.email||'';loadOrders();realtime=sb.channel('admin-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe()}
async function loadOrders(){busy(true);let r=await sb.from('orders').select('*').order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';toast(r.error.message,true)}else{orders=r.data||[];stats();render()}busy(false)}
function stats(){let c=s=>orders.filter(o=>(o.status||'placed')===s).length;$('a').textContent=orders.length;$('b').textContent=c('placed');$('c').textContent=c('shipped');$('d').textContent=c('out_for_delivery');$('e').textContent=c('delivered')}
function setFilter(f,b){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){let q=$('search').value.trim().toLowerCase(),list=orders.filter(o=>{let a=addr(o),s=o.status||'placed';if(filter!=='all'&&s!==filter)return false;if(!q)return true;return [idof(o),o.id,o.user_email,a.name,a.phone,a.city,a.pincode].join(' ').toLowerCase().includes(q)});if(!list.length){$('orders').innerHTML='<div class="empty">No orders found.</div>';return}$('orders').innerHTML=list.map(card).join('')}
function card(o){let a=addr(o),ar=its(o),s=o.status||'placed',imgs=ar.slice(0,8).map(x=>'<div class="item"><img src="'+esc(iimg(x))+'" onerror="this.style.visibility=\'hidden\'"><span>'+esc(iname(x))+' ×'+qty(x)+'</span></div>').join(''),act='';if(s==='placed')act='<button class="btn blue" onclick="processOrder(\''+o.id+'\')">Process</button><button class="btn blue" onclick="ship(\''+o.id+'\')">Ship</button><button class="btn red" onclick="cancelOrder(\''+o.id+'\')">Cancel</button>';else if(s==='processed')act='<button class="btn blue" onclick="ship(\''+o.id+'\')">Mark Shipped</button><button class="btn red" onclick="cancelOrder(\''+o.id+'\')">Cancel</button>';else if(s==='shipped')act='<button class="btn blue" onclick="status(\''+o.id+'\',\'out_for_delivery\')">Out for Delivery</button>';else if(s==='out_for_delivery')act='<button class="btn green" onclick="status(\''+o.id+'\',\'delivered\')">Mark Delivered</button>';else if(s==='cancel_requested')act='<button class="btn red" onclick="confirmCancel(\''+o.id+'\')">Confirm Cancel</button><button class="btn" onclick="rejectCancel(\''+o.id+'\')">Keep Order</button>';return '<article class="card"><div class="head"><div><div class="oid">#'+esc(idof(o))+'</div><div class="uuid">'+esc(o.id)+'</div><div class="date">'+dt(o.created_at)+'</div></div><span class="status '+esc(s)+'">'+esc(s.replaceAll('_',' '))+'</span></div><div class="items">'+(imgs||'<span class="muted">No items</span>')+'</div><div class="info"><b>'+esc(a.name||'Customer')+'</b> · '+esc(a.phone||'—')+'<br>Email: <b>'+esc(o.user_email||'—')+'</b><br>'+esc([a.house,a.road,a.city,a.district,a.state,a.pincode].filter(Boolean).join(', ')||'Address not available')+'</div><div class="chips"><span class="chip">'+esc((o.payment_method||'').toUpperCase())+'</span><span class="chip">'+ar.length+' item'+(ar.length===1?'':'s')+'</span>'+(o.courier_name?'<span class="chip">'+esc(o.courier_name)+'</span>':'')+(o.courier_tracking_id?'<span class="chip">Track: '+esc(o.courier_tracking_id)+'</span>':'')+'</div><div class="total">'+money(o.total_amount)+'</div>'+(o.cancel_reason?'<div class="info" style="color:#b45309;margin-top:6px"><b>Cancel reason:</b> '+esc(o.cancel_reason)+'</div>':'')+'<div class="cardactions"><button class="btn" onclick="details(\''+o.id+'\')">View Details</button><button class="btn" onclick="openChat(\''+o.id+'\')">💬 Chat</button>'+act+'</div></article>'}
function get(id){return orders.find(o=>o.id===id)}
async function status(id,s,extra={}){busy(true);let p={status:s,...extra},now=new Date().toISOString();if(s==='processed')p.processed_at=now;if(s==='shipped')p.shipped_at=now;if(s==='out_for_delivery')p.out_for_delivery_at=now;if(s==='delivered')p.delivered_at=now;let r=await sb.from('orders').update(p).eq('id',id);busy(false);if(r.error)toast(r.error.message,true);else{toast('Order updated');loadOrders()}}
function processOrder(id){status(id,'processed')}
function ship(id){$('actionTitle').textContent='Mark as Shipped';$('actionBody').innerHTML='<div class="field"><label>Courier Name</label><input id="courier" placeholder="Ekart / Delhivery"></div><div class="field"><label>Tracking ID</label><input id="tracking" placeholder="Tracking number"></div><button class="primary" style="width:100%" onclick="submitShip(\''+id+'\')">Confirm Shipped</button>';showM('action')}
async function submitShip(id){let c=$('courier').value.trim(),t=$('tracking').value.trim();if(!c||!t){toast('Courier and tracking ID required',true);return}closeM('action');await status(id,'shipped',{courier_name:c,courier_tracking_id:t})}
function cancelOrder(id){$('actionTitle').textContent='Cancel Order';$('actionBody').innerHTML='<div class="field"><label>Reason</label><select id="reason"><option>Out of stock</option><option>Customer requested</option><option>Address not serviceable</option><option>Payment issue</option><option>Duplicate order</option><option>Other</option></select></div><div class="field"><textarea id="reasonText" rows="3" placeholder="Details"></textarea></div><button class="primary" style="width:100%;background:#e11d48" onclick="submitCancel(\''+id+'\')">Cancel Order</button>';showM('action')}
async function submitCancel(id){let r=$('reason').value,t=$('reasonText').value.trim();if(r==='Other'&&t)r=t;closeM('action');await status(id,'cancelled',{cancelled_by:'admin',cancelled_at:new Date().toISOString(),cancel_reason:r})}
async function confirmCancel(id){if(confirm('Confirm cancellation?'))await status(id,'cancelled',{cancelled_by:'customer',cancelled_at:new Date().toISOString()})}async function rejectCancel(id){await status(id,'placed',{cancel_requested_at:null})}
function details(id){let o=get(id),a=addr(o),ar=its(o);if(!o)return;$('detailTitle').textContent='Order #'+idof(o);$('detailBody').innerHTML='<div class="grid"><div class="detail"><small>Status</small><b>'+esc(o.status)+'</b></div><div class="detail"><small>Total</small><b>'+money(o.total_amount)+'</b></div><div class="detail"><small>Payment</small><b>'+esc(o.payment_method||'—')+'</b></div><div class="detail"><small>Email</small><b>'+esc(o.user_email||'—')+'</b></div><div class="detail"><small>Customer</small><b>'+esc(a.name||'—')+'</b></div><div class="detail"><small>Mobile</small><b>'+esc(a.phone||'—')+'</b></div><div class="detail"><small>Courier</small><b>'+esc(o.courier_name||'—')+'</b></div><div class="detail"><small>Tracking</small><b>'+esc(o.courier_tracking_id||'—')+'</b></div></div><h4>Delivery Date</h4><div class="field"><input id="delivery" type="date" value="'+(o.delivery_date?new Date(o.delivery_date).toISOString().slice(0,10):'')+'"></div><button class="btn green" onclick="saveDelivery(\''+o.id+'\')">Save Delivery Date</button><h4>Items</h4><div class="items">'+ar.map(x=>'<div class="item"><img src="'+esc(iimg(x))+'"><span>'+esc(iname(x))+' ×'+qty(x)+'<br>'+money(price(x))+'</span></div>').join('')+'</div><h4>Address</h4><div class="detail">'+esc([a.name,a.phone,a.house,a.road,a.landmark,a.city,a.district,a.state,a.pincode].filter(Boolean).join(', ')||'—')+'</div>';showM('detail')}
async function saveDelivery(id){let v=$('delivery').value;if(!v)return;let r=await sb.from('orders').update({delivery_date:new Date(v+'T12:00:00').toISOString()}).eq('id',id);if(r.error)toast(r.error.message,true);else{toast('Delivery date saved');closeM('detail');loadOrders()}}
async function openChat(id){chatId=id;let o=get(id),a=addr(o);$('chatTitle').textContent='Chat — #'+idof(o)+' · '+(a.name||'Customer');showM('chat');await loadChat()}
async function loadChat(){let r=await sb.from('order_messages').select('*').eq('order_id',chatId).order('created_at',{ascending:true});if(r.error){$('chatMsgs').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}$('chatMsgs').innerHTML=(r.data||[]).map(m=>'<div class="bubble '+(m.sender_type==='admin'?'admin':'user')+'">'+esc(m.message)+'<div style="font-size:9px;opacity:.7">'+dt(m.created_at)+'</div></div>').join('')||'<div class="empty">No messages</div>';$('chatMsgs').scrollTop=$('chatMsgs').scrollHeight;await sb.from('order_messages').update({is_read:true}).eq('order_id',chatId).eq('sender_type','customer')}
async function sendChat(){let m=$('chatInput').value.trim();if(!m||!chatId)return;$('chatInput').value='';let r=await sb.from('order_messages').insert({order_id:chatId,sender_type:'admin',message:m,is_read:true});if(r.error)toast(r.error.message,true);else loadChat()}
async function openInbox(){showM('inbox');$('inboxList').innerHTML='<div class="empty">Loading...</div>';let r=await sb.from('order_messages').select('*').order('created_at',{ascending:false});if(r.error){$('inboxList').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}let seen=new Set(),h='';for(let m of r.data||[]){if(seen.has(m.order_id))continue;seen.add(m.order_id);let o=get(m.order_id),a=addr(o);h+='<div class="chatrow" onclick="closeM(\'inbox\');openChat(\''+m.order_id+'\')"><b>'+esc(a.name||'Customer')+'</b> · #'+esc(o?idof(o):String(m.order_id).slice(0,8))+'<div class="muted">'+esc(m.message)+'</div></div>'}$('inboxList').innerHTML=h||'<div class="empty">No chats yet.</div>'}
function openBroadcast(){showM('broadcast')}
async function sendNotification(){let title=$('ntitle').value.trim()||'Order Update',msg=$('nmsg').value.trim(),img=$('nimg').value.trim();if(!msg){toast('Message required',true);return}busy(true);let bc=await sb.from('broadcasts').insert({title,message:msg,image_url:img||null,is_active:true}).select().single();if(bc.error){busy(false);toast(bc.error.message,true);return}let ids=[...new Set(orders.map(o=>o.user_id).filter(Boolean))];if(ids.length){let r=await sb.from('notifications').insert(ids.map(user_id=>({user_id,title,message:msg,type:'broadcast'})));if(r.error){busy(false);toast(r.error.message,true);return}}busy(false);closeM('broadcast');toast('Notification sent')}
init();
</script></body></html>
