<!-- ===== CRITICAL FIX: clears a leftover overlay flag from the main
     theme that was causing this page to stay invisible forever, and
     forces the page visible on EVERY screen size. The theme's own
     fixed header + page-loader only un-hide themselves on mobile
     (<=768px) — on laptop/desktop they were left covering the page,
     which is why this looked blank only on laptop. Must run first,
     before anything else. ===== -->
<script>
  try { sessionStorage.removeItem('overlayOpen'); } catch(e){}
  document.documentElement.style.visibility = 'visible';
  document.body.style.visibility = 'visible';
  document.body.classList.add('ad-admin-page');

  function adForceShow(){
    document.documentElement.style.visibility = 'visible';
    document.body.style.visibility = 'visible';
    var pl = document.getElementById('pageLoader');
    if(pl) pl.classList.remove('show');
  }
  adForceShow();
  document.addEventListener('DOMContentLoaded', adForceShow);
  window.addEventListener('load', adForceShow);
  setTimeout(adForceShow, 300);
  setTimeout(adForceShow, 1500);

  // Safety stubs in case the site-wide theme script still tries to
  // call these (they don't exist on this page) — prevents a crash.
  window.openCartDrawer = window.openCartDrawer || function(){};
  window.openAccountPageFull = window.openAccountPageFull || function(){};
  window.openCategoriesPage = window.openCategoriesPage || function(){};
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://cblfmqcszdungpkbfrof.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibGZtcWNzemR1bmdwa2Jmcm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjU2MTAsImV4cCI6MjEwMDgwMTYxMH0._pOV5pHVGlE-Fl73hZ6VouR0atfq3xRVoui3WxESy9g';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var allOrders = [];
  var currentFilter = 'all';

  function money(n){ return '₹' + Math.round(n || 0).toLocaleString('en-IN'); }
  function fmtDateTime(d){
    var dt = new Date(d);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear() + ' ' + dt.getHours() + ':' + String(dt.getMinutes()).padStart(2,'0');
  }
  function fmtDateShort(d){
    var dt = new Date(d);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return dt.getDate() + ' ' + months[dt.getMonth()];
  }
  // NEW: date + time like "3 Aug, 6:42 PM" used for the "Delivered, ..." tag
  function fmtDateShortTime(d){
    var dt = new Date(d);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var h = dt.getHours(), m = String(dt.getMinutes()).padStart(2,'0');
    var ampm = h>=12?'PM':'AM';
    var h12 = h%12; if(h12===0) h12=12;
    return dt.getDate()+' '+months[dt.getMonth()]+', '+h12+':'+m+' '+ampm;
  }
  function toDateInputValue(d){
    var dt = new Date(d);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  }
  function escapeHtml(str){
    return (str || '').toString().replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // NEW: loader overlay controls
  function adShowLoader(){
    var ov = document.getElementById('adLoaderOverlay');
    if(ov) ov.classList.add('show');
  }
  function adHideLoader(){
    var ov = document.getElementById('adLoaderOverlay');
    if(ov) ov.classList.remove('show');
  }

  // NEW: toast notification controls
  var adToastTimer = null;
  function adShowToast(msg, isError){
    var t = document.getElementById('adToast');
    if(!t) return;
    t.textContent = msg;
    t.className = 'adtoast show' + (isError ? ' error' : '');
    clearTimeout(adToastTimer);
    adToastTimer = setTimeout(function(){
      t.className = 'adtoast';
    }, 2600);
  }

  function initAdmin(){
    sb.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if(session){
        checkIsAdmin(session.user.id).then(function(isAdmin){
          if(isAdmin){
            showDashboard(session.user);
          } else {
            sb.auth.signOut().then(function(){ showLogin('You are not authorized as admin.'); });
          }
        });
      } else {
        showLogin();
      }
    }).catch(function(err){
      showLogin('Session check failed: ' + err.message);
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initAdmin);
  } else {
    initAdmin();
  }

  function checkIsAdmin(userId){
    return sb.from('profiles').select('is_admin').eq('id', userId).maybeSingle().then(function(res){
      return !!(res.data && res.data.is_admin === true);
    });
  }

  function showLogin(errMsg){
    document.getElementById('adLoginScreen').style.display = 'flex';
    document.getElementById('adDashboard').style.display = 'none';
    if(errMsg){
      var e = document.getElementById('adLoginErr');
      e.textContent = errMsg;
      e.style.display = 'block';
    }
  }

  // NEW: live real-time clock in the header, updates every second
  var adClockTimer = null;
  function adStartClock(){
    function tick(){
      var el = document.getElementById('adLiveClock');
      if(!el) return;
      var now = new Date();
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0'), s = String(now.getSeconds()).padStart(2,'0');
      var ampm = h >= 12 ? 'PM' : 'AM';
      var h12 = h % 12; if(h12 === 0) h12 = 12;
      el.textContent = months[now.getMonth()] + ' ' + now.getDate() + ', ' + h12 + ':' + m + ':' + s + ' ' + ampm;
    }
    tick();
    clearInterval(adClockTimer);
    adClockTimer = setInterval(tick, 1000);
  }

  function showDashboard(user){
    document.getElementById('adLoginScreen').style.display = 'none';
    document.getElementById('adDashboard').style.display = 'block';
    document.getElementById('adAdminEmail').textContent = user.email;
    adStartClock();
    adLoadOrders();
  }

  window.adDoLogin = async function(){
    var email = document.getElementById('adEmail').value.trim();
    var password = document.getElementById('adPassword').value;
    var errEl = document.getElementById('adLoginErr');
    var btn = document.getElementById('adLoginBtn');
    errEl.style.display = 'none';

    if(!email || !password){
      errEl.textContent = 'Please enter email and password.';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try{
      var res = await sb.auth.signInWithPassword({ email: email, password: password });

      if(res.error){
        btn.disabled = false;
        btn.textContent = 'Log In';
        errEl.textContent = res.error.message;
        errEl.style.display = 'block';
        return;
      }

      var isAdmin = await checkIsAdmin(res.data.user.id);
      btn.disabled = false;
      btn.textContent = 'Log In';

      if(!isAdmin){
        await sb.auth.signOut();
        errEl.textContent = 'This account is not authorized as admin.';
        errEl.style.display = 'block';
        return;
      }

      showDashboard(res.data.user);
    } catch(err){
      btn.disabled = false;
      btn.textContent = 'Log In';
      errEl.textContent = 'Login failed: ' + err.message;
      errEl.style.display = 'block';
    }
  };

  window.adDoLogout = async function(){
    await sb.auth.signOut();
    showLogin();
  };

  // ===== LOAD ORDERS =====
  window.adLoadOrders = async function(){
    var list = document.getElementById('adOrdersList');
    adShowLoader();
    try{
      var res = await sb.from('orders').select('*').order('created_at', { ascending: false });
      if(res.error){
        list.innerHTML = '<div class="adempty">Error loading orders: ' + escapeHtml(res.error.message) + '</div>';
        adHideLoader();
        return;
      }
      allOrders = res.data || [];
      renderOrders();
    } catch(err){
      list.innerHTML = '<div class="adempty">Error loading orders: ' + escapeHtml(err.message) + '</div>';
    }
    adHideLoader();
  };

  window.adSetFilter = function(filter, btnEl){
    currentFilter = filter;
    document.querySelectorAll('.adfilterbtn').forEach(function(b){ b.classList.remove('active'); });
    btnEl.classList.add('active');
    renderOrders();
  };

  function renderOrders(){
    var list = document.getElementById('adOrdersList');
    var filtered = currentFilter === 'all' ? allOrders : allOrders.filter(function(o){ return o.status === currentFilter; });

    if(!filtered.length){
      list.innerHTML = '<div class="adempty">No orders in this view.</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(order){
      var items = order.items || [];
      var addr = order.address || {};
      var thumbs = items.map(function(it){
        var img = '<img class="aditemthumb" src="' + (it.image||'') + '" alt="">';
        if(it.url){
          return '<a href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener">' + img + '</a>';
        }
        return img;
      }).join('');
      var deliveryVal = toDateInputValue(order.delivery_date || new Date(new Date(order.created_at).getTime() + 5*24*60*60*1000));

      // "Delivered, 3 Aug, 6:42 PM" tag shown next to the status badge
      // (wraps to its own line on phone via the media query in <style>)
      var deliveredTag = '';
      if(order.status === 'delivered'){
        var dDate = order.delivered_at || order.updated_at || order.created_at;
        deliveredTag = '<span class="addeliveredtag">Delivered, ' + fmtDateShortTime(dDate) + '</span>';
      }

      // NEW: "Cancelled by you" / "Cancelled by Customer" tag next to the CANCELLED badge
      var cancelledTag = '';
      if(order.status === 'cancelled'){
        cancelledTag = order.cancelled_by === 'admin'
          ? '<span class="adcancelledtag">Cancelled by you</span>'
          : '<span class="adcancelledtag">Cancelled by Customer</span>';
      }

      var actionsHtml = '';
      if(order.status === 'cancel_requested'){
        actionsHtml =
          '<button class="adactionbtn confirm" onclick="adConfirmCancel(\'' + order.id + '\')">Confirm Cancellation</button>'
          + '<button class="adactionbtn reject" onclick="adRejectCancel(\'' + order.id + '\')">Reject (Keep Order)</button>';
      } else if(order.status === 'placed'){
        actionsHtml = '<button class="adactionbtn ship" onclick="adMarkStatus(\'' + order.id + '\',\'shipped\')">Mark Shipped</button>'
          + '<button class="adactionbtn cancel" onclick="adAdminCancelOrder(\'' + order.id + '\')">Cancel Order</button>';
      } else if(order.status === 'shipped'){
        actionsHtml = '<button class="adactionbtn deliver" onclick="adMarkStatus(\'' + order.id + '\',\'delivered\')">Mark Delivered</button>'
          + '<button class="adactionbtn cancel" onclick="adAdminCancelOrder(\'' + order.id + '\')">Cancel Order</button>';
      } else if(order.status === 'cancelled'){
        var byText = order.cancelled_by === 'admin' ? '(by you)' : '(by Customer)';
        actionsHtml = '<span style="font-size:12.5px;color:#767e8c;">Order cancelled. ' + byText + '</span>';
      } else if(order.status === 'delivered'){
        actionsHtml = '<span style="font-size:12.5px;color:#767e8c;">Order delivered.</span>';
      }

      html += '<div class="adordercard">'
        + '<div class="adordertop">'
        + '<div><div class="adorderid">#' + order.id + '</div><div class="adorderdate">' + fmtDateTime(order.created_at) + '</div></div>'
        + '<div class="adbadgewrap"><span class="adbadge ' + order.status + '">' + order.status.replace('_',' ') + '</span>' + deliveredTag + cancelledTag + '</div>'
        + '</div>'
        + (order.cancel_reason ? '<div class="adreasonline">Reason: <b>' + escapeHtml(order.cancel_reason) + '</b></div>' : '')
        + '<div class="aditemsrow">' + thumbs + '</div>'
        + '<div class="adcustomer"><b>' + escapeHtml(addr.name) + '</b> · ' + escapeHtml(addr.phone) + '</div>'
        + '<div class="ademail">Email: <b>' + escapeHtml(order.user_email || '—') + '</b></div>'
        + '<div class="adaddr">' + [addr.house, addr.road, addr.city + ', ' + addr.state + ' ' + addr.pincode].filter(Boolean).map(escapeHtml).join(', ') + '</div>'
        + '<div class="adcustomer">Total: <b>' + money(order.total_amount) + '</b> · ' + (order.payment_method === 'cod' ? 'Cash on Delivery' : (order.payment_method||'').toUpperCase()) + '</div>'
        + '<div class="addeliveryrow">'
        + '<label>Delivery date:</label>'
        + '<input type="date" id="addate-' + order.id + '" value="' + deliveryVal + '">'
        + '<button onclick="adSaveDeliveryDate(\'' + order.id + '\')">Save</button>'
        + '</div>'
        + '<div class="adactions">' + actionsHtml + '</div>'
        + '</div>';
    });
    list.innerHTML = html;
  }

  // ===== ACTIONS =====
  window.adConfirmCancel = async function(orderId){
    if(!confirm('Confirm cancellation for this order? This cannot be undone.')) return;
    adShowLoader();
    var res = await sb.from('orders')
      .update({ status: 'cancelled', cancelled_by: 'customer' })
      .eq('id', orderId)
      .eq('status', 'cancel_requested')
      .select();
    if(!res.data || !res.data.length){
      adHideLoader();
      adShowToast('Could not update — order state may have changed.', true);
      return;
    }
    await adLoadOrders();
    adHideLoader();
    adShowToast('Order Cancelled (by Customer)', false);
  };

  window.adRejectCancel = async function(orderId){
    if(!confirm('Reject this cancellation request and keep the order as placed?')) return;
    adShowLoader();
    var res = await sb.from('orders')
      .update({ status: 'placed' })
      .eq('id', orderId)
      .eq('status', 'cancel_requested')
      .select();
    if(!res.data || !res.data.length){
      adHideLoader();
      adShowToast('Could not update — order state may have changed.', true);
      return;
    }
    await adLoadOrders();
    adHideLoader();
    adShowToast('Cancellation Rejected', false);
  };

  // Direct admin cancel — available while order is "placed" or "shipped".
  // Shows a Yes/No confirm popup first; only proceeds if the admin confirms.
  window.adAdminCancelOrder = async function(orderId){
    if(!confirm('Kya aap sach me is order ko cancel karna chahte hain? Yeh undo nahi ho sakta.')) return;
    adShowLoader();
    var res = await sb.from('orders')
      .update({ status: 'cancelled', cancelled_by: 'admin' })
      .eq('id', orderId)
      .select();
    if(!res.data || !res.data.length){
      adHideLoader();
      adShowToast('Order cancel nahi ho paaya.', true);
      return;
    }
    await adLoadOrders();
    adHideLoader();
    adShowToast('Order Cancelled (by you)', false);
  };

  window.adMarkStatus = async function(orderId, newStatus){
    adShowLoader();
    // when marking delivered, stamp delivered_at so the customer
    // page and this admin page can both show "Delivered, 3 Aug, 6:42 PM".
    var updateObj = { status: newStatus };
    if(newStatus === 'delivered'){
      updateObj.delivered_at = new Date().toISOString();
    }
    var res;
    try{
      res = await sb.from('orders').update(updateObj).eq('id', orderId).select();
    } catch(err){
      adHideLoader();
      adShowToast('Error: ' + err.message, true);
      return;
    }
    if(!res.data || !res.data.length){
      adHideLoader();
      adShowToast('Could not update order.', true);
      return;
    }
    await adLoadOrders();
    adHideLoader();
    var label = newStatus === 'shipped' ? 'Customer Order Shipped' : (newStatus === 'delivered' ? 'Customer Order Delivered' : 'Order Updated');
    adShowToast(label, false);
  };

  window.adSaveDeliveryDate = async function(orderId){
    var input = document.getElementById('addate-' + orderId);
    var val = input.value;
    if(!val) return;
    var res = await sb.from('orders')
      .update({ delivery_date: new Date(val).toISOString() })
      .eq('id', orderId)
      .select();
    if(!res.data || !res.data.length){
      alert('Could not save delivery date.');
    } else {
      input.style.borderColor = '#1a7f37';
      setTimeout(function(){ input.style.borderColor = '#e0e0e0'; }, 1200);
    }
  };

})();

</script>
